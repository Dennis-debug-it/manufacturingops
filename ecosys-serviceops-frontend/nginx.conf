server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Declare UTF-8 on text assets so dashes, ellipses and currency symbols never render as mojibake.
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Don't advertise the nginx version in the Server header / error pages (X-03).
    server_tokens off;

    # Security headers for the static SPA. CSP is set here because the browser only honours
    # the policy delivered with the *document*, and the document comes from this server
    # (see docs/DEPLOYMENT.md §4). The API sets its own, separate, per-request policy in
    # Program.cs for JSON/downloads/Swagger - the two are deliberately different and neither
    # is a copy of the other.
    #
    # This file is a template. /docker-entrypoint.d/10-ecosys-csp.sh substitutes
    # ${ECOSYS_CSP_CONNECT_SRC} at container start and writes the result to
    # /etc/nginx/conf.d/default.conf; nginx variables like $host survive untouched because
    # envsubst is given an explicit one-variable allow-list. Unset, it expands to nothing
    # and the policy is `connect-src 'self'` - correct for the shipped stack, where nginx
    # proxies /api, /hubs and /files on this same origin. Set it (space-separated origins,
    # e.g. "https://api.example.com wss://api.example.com") only when the API or the
    # SignalR hub lives on a different origin. It is never widened to '*'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'${ECOSYS_CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Explicit X-Frame-Options for older browsers that don't honor CSP frame-ancestors (F4-02).
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # ---- API ----
    location /api {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SignalR (WebSockets) ----
    location /hubs {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ---- Attachment files served by the API ----
    location /files {
        proxy_pass http://api:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri /index.html;
    }
}
